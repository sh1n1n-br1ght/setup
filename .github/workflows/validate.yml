name: Validate installers
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  round-trip:
    name: config round trip (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Backup and restore in every available shell
        run: |
          for shell in sh dash bash zsh; do
            if command -v "$shell" >/dev/null; then
              "$shell" -n install.sh
              TEST_SHELL=$shell sh tests/test_install.sh
            fi
          done

  install:
    name: install on ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Ubuntu x86_64, os: ubuntu-latest, piped: true }
          - { name: Ubuntu arm64, os: ubuntu-24.04-arm }
          - { name: macOS arm64, os: macos-latest, piped: true }
          - { name: macOS x86_64, os: macos-15-intel }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      # On pushes, install the way the one-liner does: piped into sh, downloading this commit.
      DEVKIT_TEST_REF: ${{ matrix.piped && github.event_name == 'push' && github.sha || '' }}
      DEVKIT_TEST_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - run: sh tests/test_e2e.sh

  distros:
    name: install on ${{ matrix.image }}
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: debian:12-slim # no curl, git or compiler; tree-sitter needs conda-forge
          - image: ubuntu:20.04 # glibc 2.31: Neovim's builds for old distributions
          - image: rockylinux:8 # glibc 2.28, dnf
          - image: fedora:latest
          - image: archlinux:latest
          - image: opensuse/tumbleweed
          - image: alpine:edge # musl and busybox; no tree-sitter CLI build
            expect: plugins
    env:
      DEVKIT_EXPECT: ${{ matrix.expect }}
    steps:
      - uses: actions/checkout@v4
      - name: Test tools (diff)
        run: |
          command -v diff >/dev/null || dnf install -y diffutils || zypper --non-interactive install diffutils || pacman -Sy --noconfirm diffutils
      - run: sh tests/test_e2e.sh

  no-root:
    name: install without root, sudo or git (ubuntu:22.04)
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Only curl, as on a fresh server where `curl | sh` runs
        run: apt-get update && apt-get install -y --no-install-recommends curl ca-certificates
      - name: Install as an ordinary user
        run: |
          useradd -m guest
          cp -R "$GITHUB_WORKSPACE" /home/guest/setup
          chown -R guest /home/guest/setup
          su guest -c 'cd ~/setup && sh tests/test_e2e.sh'

  windows:
    name: Windows ${{ matrix.arch }} (${{ matrix.shell }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, arch: x64, shell: powershell, piped: true }
          - { os: windows-latest, arch: x64, shell: pwsh }
          - { os: windows-11-arm, arch: arm64, shell: powershell }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      # On pushes, the full install runs the way `irm ... | iex` does, downloading this commit.
      DEVKIT_TEST_REF: ${{ matrix.piped && github.event_name == 'push' && github.sha || '' }}
      DEVKIT_TEST_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Parse
        shell: ${{ matrix.shell }}
        run: |
          foreach ($file in 'install.ps1', 'tests\test_windows.ps1') {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file).Path, [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { $errors | Format-List; exit 1 }
          }
      - name: Config round trip
        shell: ${{ matrix.shell }}
        run: .\tests\test_windows.ps1 -Ref ''
      - name: Full install
        shell: ${{ matrix.shell }}
        run: .\tests\test_windows.ps1 -Full

  pages:
    needs: [round-trip, install, distros, no-root, windows]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: installer-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - run: python3 tools/build_pages.py _site --revision "$GITHUB_SHA"
      - run: |
          sh -n _site/index.html
          sh -n _site/u
          tail -n 1 _site/u | grep -qx 'main uninstall "\$@"; exit'
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment

  public-entrypoints:
    needs: pages
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $base = 'https://sh1n1n-br1ght.github.io/setup'
          foreach ($name in @('w', 'x')) {
            $body = irm "$base/$name`?v=$env:GITHUB_SHA"
            if ($body -isnot [string]) { throw "$name must download as a script string" }
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseInput($body, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { throw "Invalid PowerShell entry point: $name" }
            $source = [IO.File]::ReadAllText((Join-Path $PWD 'install.ps1')) -replace "`r`n", "`n"
            if ($name -eq 'x') { $source = $source.Replace("[string]`$Action = 'Install',", "[string]`$Action = 'Uninstall',") }
            $expected = "& {`n" + $source + "`n}`n"
            if ($body -cne $expected) { throw "$name does not match this commit" }
          }
