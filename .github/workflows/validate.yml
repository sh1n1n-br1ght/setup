name: Validate installers
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      full_provision:
        description: Install and uninstall the full environment on a disposable Linux runner
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  lifecycle:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: bash -n install.sh
      - run: python3 -m unittest discover -s tests -v
  powershell:
    strategy:
      matrix:
        shell: [powershell, pwsh]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: ${{ matrix.shell }}
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'install.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count) {
            $errors | Format-List
            exit 1
          }
      - shell: ${{ matrix.shell }}
        run: .\tests\test_windows.ps1
  pages:
    needs: [lifecycle, powershell]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: installer-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - run: python3 tools/build_pages.py _site --revision "$GITHUB_SHA"
      - run: |
          bash -n _site/index.html
          bash -n _site/u
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
  public-entrypoints:
    needs: pages
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $base = 'https://sh1n1n-br1ght.github.io/setup'
          foreach ($name in @('w', 'x')) {
            $body = irm "$base/$name`?v=$env:GITHUB_SHA"
            if ($body -isnot [string]) { throw "$name must download as a script string" }
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseInput($body, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { throw "Invalid PowerShell entry point: $name" }
            $source = [IO.File]::ReadAllText((Join-Path $PWD 'install.ps1')) -replace "`r`n", "`n"
            if ($name -eq 'x') { $source = $source.Replace("[string]`$Action = 'Install',", "[string]`$Action = 'Uninstall',") }
            $expected = "& {`n" + $source + "`n}`n"
            if ($body -cne $expected) { throw "$name does not match this commit" }
          }
  full-provision:
    if: github.event_name == 'workflow_dispatch' && inputs.full_provision
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: bash install.sh --root "$RUNNER_TEMP/devkit-smoke"
      - run: |
          "$HOME/.local/bin/devkit" status
          "$HOME/.local/bin/devkit" doctor
          "$HOME/.local/bin/devkit" nvim --headless -i NONE -c 'lua dofile(vim.env.DEVKIT_ENV .. "/source/tests/nvim_completion.lua")'
      - if: always()
        run: bash install.sh --root "$RUNNER_TEMP/devkit-smoke" --uninstall
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: devkit-smoke-diagnostics
          path: |
            ${{ runner.temp }}/devkit-smoke/**/journal.jsonl
            ${{ runner.temp }}/devkit-smoke/**/packages.jsonl
            ${{ runner.temp }}/devkit-smoke/bootstrap-journal.jsonl
            ${{ runner.temp }}/devkit-smoke/archives/**/package-cleanup-*.json
            ${{ runner.temp }}/devkit-smoke/archives/**/RESTORE.txt
          if-no-files-found: ignore
